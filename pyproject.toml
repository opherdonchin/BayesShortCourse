[project]
name = "bayes-short-course"
version = "0.1.0"
description = "Local environment reproducing the Colab package set used by the course notebooks."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pymc==6.3.2",
    "arviz-base==1.3.0",
    "arviz-stats==1.3.2",
    "arviz-plots[matplotlib]==1.3.1",
    "preliz==0.28.0",
    "bambi==0.21.0",
    "ipykernel",
    "ipywidgets>=8.1.9",
]

[tool.uv]
package = false
